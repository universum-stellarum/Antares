name: universum-identity-${APP_ENV}

services:
  identity:
    build: .
    restart: unless-stopped
    init: true

    environment:
      SPRING_PROFILES_ACTIVE: ${APP_ENV}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}

    expose:
      - "8080"

    networks:
      services:
        aliases:
          - identity

    read_only: true

    tmpfs:
      - /tmp:mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

networks:
  services:
    external: true
    name: universum-${APP_ENV}
